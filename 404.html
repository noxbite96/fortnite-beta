<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chargement…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #071026; }
  body { display: flex; align-items: center; justify-content: center; color: #fff;
         font-family: 'Segoe UI', Arial, sans-serif; }
  .box { text-align: center; max-width: 560px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 14px; letter-spacing: 2px; text-transform: uppercase; }
  .bar { height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 30%; background: #ffb43c;
          animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  p { color: #9fb4d8; font-size: 14px; margin-top: 16px; }
  code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; }
</style>
</head>
<body>
<div class="box">
  <h1>Redirection…</h1>
  <div class="bar"><i></i></div>
  <p>Si rien ne se passe, ouvre directement <code>index.html</code>.</p>
</div>
<script>location.replace('index.html' + location.search + location.hash);</script>
</body>
</html>
