<!-- Avertissement si le jeu est servi en HTTP : le navigateur bloque
     alors la capture de la souris, et la caméra devient impraticable. -->
<div id="http-warning" class="screen hidden">
  <div style="max-width:520px;padding:24px;text-align:center;font-family:Arial,sans-serif">
    <h2 style="color:#ffb43c;margin:0 0 12px">JEU EN HTTP</h2>
    <p style="color:#c9d8f0;line-height:1.6">
      Le navigateur réserve la capture de la souris aux sites sécurisés.<br>
      Tu peux jouer, mais la caméra ne se tournera pas à la souris.<br><br>
      Utilise <b>I J K L</b> pour regarder, ou republie le jeu en <b>HTTPS</b>.
    </p>
  </div>
</div>

<script>
  // Alerte si le jeu est servi sans HTTPS : la capture de la souris est
  // bloquée par les navigateurs sur un contexte non sécurisé.
  (function () {
    try {
      var secure = window.isSecureContext;
      var proto = location.protocol;
      var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      if (!local && !secure && (proto === 'http:' || proto === 'file:')) {
        var w = document.getElementById('http-warning');
        if (w) w.classList.remove('hidden');
      }
    } catch (e) { /* navigateur ancien : on laisse le jeu se charger */ }
  })();
</script>
